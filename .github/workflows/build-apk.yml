name: Build APK

# Packs the game into an Android APK with Capacitor.
# Download it from the run's "Artifacts" section. It is a debug build, signed with a temporary key.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "unsorted/_art-src/**"
      - "unsorted/dev/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Install ffmpeg (sound compression)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Copy the game into mobile/www
        working-directory: mobile
        run: node prepare-www.mjs --webp --ogg

      - name: Create the Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android
          # more memory for Gradle: the app carries thousands of image and sound files
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> android/gradle.properties
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/NaBlooLife.apk
          ls -lh dist

      - uses: actions/upload-artifact@v5
        with:
          name: NaBlooLife-apk
          path: dist/NaBlooLife.apk
          retention-days: 30
          compression-level: 0
