name: Build APK

# Packs the game into an Android APK with Capacitor.
# Download it from the run's "Artifacts" section. It is signed with the permanent key held in repository secrets.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "unsorted/_art-src/**"
      - "unsorted/dev/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Install ffmpeg (sound compression)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Copy the game into mobile/www
        working-directory: mobile
        run: node prepare-www.mjs --webp --ogg

      - name: Create the Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android
          # app icon from unsorted/ui/navbarNabloo.png
          node make-icons.mjs
          # more memory for Gradle: the app carries thousands of image and sound files
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> android/gradle.properties
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build the release APK (unsigned)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # the permanent key comes from repository secrets and is only given to this step
      - name: Sign the APK with the permanent key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # public fingerprint of the key (safe to share): stops a build signed with any other key
          CERT_SHA256: "89e28c767e545d8e6b91f310255c557bf789f8fa6fc785f1774b327acad8479a"
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets (Settings, Secrets and variables, Actions)"
            exit 1
          fi
          KS="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$KS"' EXIT
          echo "$KS_B64" | base64 -d > "$KS"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          "$BT/zipalign" -f -p 4 mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias nabloolife --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out dist/NaBlooLife.apk "$RUNNER_TEMP/aligned.apk"
          rm -f dist/*.idsig
          "$BT/apksigner" verify --print-certs dist/NaBlooLife.apk | tee "$RUNNER_TEMP/certs.txt"
          grep -qi "SHA-256 digest: $CERT_SHA256" "$RUNNER_TEMP/certs.txt" || { echo "::error::The APK was signed with a different key"; exit 1; }
          ls -lh dist

      - uses: actions/upload-artifact@v5
        with:
          name: NaBlooLife-apk
          path: dist/NaBlooLife.apk
          retention-days: 30
          compression-level: 0
