<!doctype html>
<html><head><meta charset="utf-8"><title>gang icon</title>
<style>html,body{margin:0;background:transparent}svg{display:block;width:480px;height:480px}</style></head>
<body>
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0473f"/><stop offset=".55" stop-color="#cf1f24"/><stop offset="1" stop-color="#94121a"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".35" stop-color="#000" stop-opacity="0"/>
      <stop offset=".65" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="knot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3373a"/><stop offset="1" stop-color="#8e1016"/>
    </linearGradient>
    <radialGradient id="gloss" cx=".32" cy=".22" r=".55">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2.2"/></filter>
    <!-- gota de cachemira (paisley) -->
    <g id="pz">
      <path d="M0 -9 C7 -9 10 -2 7 4 C4 9 -3 10 -6 6 C-9 2 -6 -3 -1 -3 C2 -3 3 -6 0 -9 Z" fill="#fff"/>
      <path d="M0 -4 C3 -4 5 -1 3 2 C1 4 -2 4 -3 2 C-4 0 -2 -2 0 -1 Z" fill="#cf1f24"/>
      <circle cx="-0.5" cy="0.5" r="1.1" fill="#fff"/>
    </g>
    <clipPath id="clip"><path d="M8 34 Q60 25 112 34 L66 104 Q60 113 54 104 Z"/></clipPath>
  </defs>

  <!-- sombra -->
  <ellipse cx="60" cy="112" rx="30" ry="4" fill="#000" opacity=".35" filter="url(#blur)"/>

  <!-- puntas del nudo atrás -->
  <path d="M52 30 C40 18 30 14 22 16 C28 22 34 27 46 34 Z" fill="url(#knot)" stroke="#6d0b10" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M68 30 C80 18 90 14 98 16 C92 22 86 27 74 34 Z" fill="url(#knot)" stroke="#6d0b10" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- pañuelo doblado en triángulo -->
  <path d="M8 34 Q60 25 112 34 L66 104 Q60 113 54 104 Z" fill="url(#red)" stroke="#6d0b10" stroke-width="1.6" stroke-linejoin="round"/>
  <g clip-path="url(#clip)">
    <!-- borde punteado -->
    <path d="M18 39 Q60 31 102 39 L63 97 Q60 101 57 97 Z" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="0.1 4.2" stroke-linecap="round"/>
    <path d="M23 42 Q60 35 97 42" fill="none" stroke="#fff" stroke-width="1" opacity=".85"/>
    <!-- estampado -->
    <use href="#pz" transform="translate(60 52) scale(1.35)"/>
    <use href="#pz" transform="translate(40 49) rotate(-35)"/>
    <use href="#pz" transform="translate(80 49) rotate(35) scale(-1 1)"/>
    <use href="#pz" transform="translate(50 68) rotate(20) scale(.95)"/>
    <use href="#pz" transform="translate(70 68) rotate(-20) scale(-.95 .95)"/>
    <use href="#pz" transform="translate(60 84) scale(.85)"/>
    <circle cx="31" cy="44" r="1.6" fill="#fff"/><circle cx="89" cy="44" r="1.6" fill="#fff"/>
    <circle cx="60" cy="40" r="1.6" fill="#fff"/><circle cx="44" cy="60" r="1.3" fill="#fff"/>
    <circle cx="76" cy="60" r="1.3" fill="#fff"/><circle cx="60" cy="96" r="1.3" fill="#fff"/>
    <!-- pliegues y volumen -->
    <path d="M30 37 Q46 70 58 104" fill="none" stroke="#5a070c" stroke-width="1.4" opacity=".35"/>
    <path d="M90 37 Q74 70 62 104" fill="none" stroke="#5a070c" stroke-width="1.4" opacity=".35"/>
    <rect x="0" y="0" width="120" height="120" fill="url(#side)"/>
    <rect x="0" y="0" width="120" height="120" fill="url(#gloss)"/>
  </g>

  <!-- nudo al frente -->
  <ellipse cx="60" cy="31" rx="9" ry="7" fill="url(#knot)" stroke="#6d0b10" stroke-width="1.4"/>
  <path d="M55 28 Q60 25 65 28" fill="none" stroke="#fff" stroke-width="1.2" opacity=".5"/>
</svg>
</body></html>
