<!doctype html>
<html><head><meta charset="utf-8"><title>Piezas</title>
<style>
  body{margin:0;background:#e9edf2;font:600 14px system-ui,sans-serif;color:#333;padding:18px;width:1060px}
  .row{display:flex;gap:6px;margin-bottom:6px;align-items:flex-end}
  .row svg{width:128px;height:128px}
  .ref{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
  .ref img{width:96px;height:96px;image-rendering:auto;background:#e9edf2}
  .board{display:grid;width:fit-content;grid-template-columns:repeat(8,56px);border-radius:8px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.25);margin-top:10px}
  .sq{width:56px;height:56px;display:flex;align-items:center;justify-content:center}
  .l{background:#eed9b6}.d{background:#b58863}
  .sq svg{width:52px;height:52px}
  .wrap{display:flex;gap:30px;align-items:flex-start}
  h3{margin:6px 0}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- Volumen de cilindro: oscuro en los bordes, brillo a la izquierda (como el peón de Apple) -->
    <linearGradient id="gB" x1="18" x2="82" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/><stop offset=".28" stop-color="#4b4b4f"/>
      <stop offset=".45" stop-color="#26262a"/><stop offset=".8" stop-color="#0d0d0f"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="gW" x1="18" x2="82" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9ae98"/><stop offset=".28" stop-color="#fffdf6"/>
      <stop offset=".5" stop-color="#efe6d3"/><stop offset=".85" stop-color="#cbbfa6"/>
      <stop offset="1" stop-color="#a69a82"/>
    </linearGradient>
    <radialGradient id="gloss" cx=".35" cy=".25" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>

    <!-- Base común -->
    <g id="base">
      <rect x="22" y="84" width="56" height="10" rx="4"/>
      <ellipse cx="50" cy="84" rx="28" ry="3.6"/>
      <rect x="27" y="77" width="46" height="8" rx="3.5"/>
    </g>

    <g id="pawn">
      <use href="#base"/>
      <path d="M36 78 C38 66 44 62 44.5 57 L55.5 57 C56 62 62 66 64 78 Z"/>
      <ellipse cx="50" cy="56" rx="13" ry="3.6"/>
      <circle cx="50" cy="41" r="12.5"/>
    </g>

    <g id="rook">
      <use href="#base"/>
      <path d="M34 78 L37.5 48 L62.5 48 L66 78 Z"/>
      <rect x="33" y="44" width="34" height="6" rx="2.5"/>
      <path d="M31 45 L31 25 L39.5 25 L39.5 31.5 L45.5 31.5 L45.5 25 L54.5 25 L54.5 31.5 L60.5 31.5 L60.5 25 L69 25 L69 45 Z"/>
    </g>

    <g id="bishop">
      <use href="#base"/>
      <path d="M35 78 C39 67 44 61 44.5 53 L55.5 53 C56 61 61 67 65 78 Z"/>
      <ellipse cx="50" cy="52" rx="12.5" ry="3.4"/>
      <path d="M50 19 C37 29 37.5 44 42 50 L58 50 C62.5 44 63 29 50 19 Z"/>
      <circle cx="50" cy="15.5" r="4.2"/>
    </g>

    <g id="knight">
      <use href="#base"/>
      <path d="M33 78 C33 67 39 61 44 55 C39 53 32 51 29.5 47 C27.5 43.5 29.5 39 34 37.5 L44 34.5
               C45.5 29 44 23 47.5 15.5 L52.5 22 C61 22.5 69 31 69 45 C69 59 64.5 67 67 78 Z"/>
    </g>

    <g id="queen">
      <use href="#base"/>
      <path d="M34 78 C39 65 43 57 43 47 L57 47 C57 57 61 65 66 78 Z"/>
      <ellipse cx="50" cy="46.5" rx="14.5" ry="3.8"/>
      <path d="M36 43 L31 23 L40 33 L41.5 18 L46.5 31 L50 14 L53.5 31 L58.5 18 L60 33 L69 23 L64 43 Z"/>
      <circle cx="31" cy="21.5" r="3.4"/><circle cx="41.5" cy="16.5" r="3.4"/>
      <circle cx="50" cy="12.5" r="3.6"/><circle cx="58.5" cy="16.5" r="3.4"/><circle cx="69" cy="21.5" r="3.4"/>
    </g>

    <g id="king">
      <use href="#base"/>
      <path d="M34 78 C39 65 43 57 43 47 L57 47 C57 57 61 65 66 78 Z"/>
      <ellipse cx="50" cy="46.5" rx="14.5" ry="3.8"/>
      <path d="M37 43 C32 31 39 25 50 27 C61 25 68 31 63 43 Z"/>
      <rect x="47" y="7" width="6" height="21" rx="1.5"/>
      <rect x="41.5" y="11.5" width="17" height="6" rx="1.5"/>
    </g>
  </defs>
</svg>

<script>
const KINDS = ["king", "queen", "rook", "bishop", "knight", "pawn"];
// Detalles por pieza, en el color de "corte" (raya de la mitra, ojo y crin del caballo)
const DETAIL = {
  bishop: (c) => `<path d="M54 29 L46 40" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/>`,
  knight: (c) => `<circle cx="48.5" cy="31" r="2.2" fill="${c}"/>
                  <path d="M33.5 43 L37 43" stroke="${c}" stroke-width="2" stroke-linecap="round"/>
                  <path d="M56 25 C62 31 64 40 63 50 M60 27 C66 34 67 45 65.5 56" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>`,
  rook: (c) => `<path d="M38 60 L62 60" stroke="${c}" stroke-width="1.4" opacity=".5"/>`,
};
function piece(kind, white, size) {
  const fill = white ? "url(#gW)" : "url(#gB)";
  const stroke = white ? "#7d725e" : "#000";
  const cut = white ? "#8a7f69" : "#5a5a60";
  return `<svg viewBox="${size < 80 ? "8 4 84 92" : "0 0 100 100"}" width="${size}" height="${size}">
    <ellipse cx="50" cy="95" rx="30" ry="3.2" fill="#000" opacity=".28" filter="url(#sh)"/>
    <g fill="${fill}" stroke="${stroke}" stroke-width="1.4" stroke-linejoin="round"><use href="#${kind}"/></g>
    <g fill="url(#gloss)" opacity="${white ? 0.6 : 0.9}"><use href="#${kind}"/></g>
    ${DETAIL[kind] ? DETAIL[kind](cut) : ""}
  </svg>`;
}
const W = (k) => piece(k, true, 128), B = (k) => piece(k, false, 128);
document.body.insertAdjacentHTML("beforeend", `
  <div class="ref"><img src="ref-pawn.png" onerror="this.remove()">
  <span>← referencia: el peón ♟️ de Apple que ya trae el juego</span></div>
  <div class="row">${KINDS.map(W).join("")}</div>
  <div class="row">${KINDS.map(B).join("")}</div>`);

// Tablero en posición inicial
const back = ["rook", "knight", "bishop", "queen", "king", "bishop", "knight", "rook"];
let cells = "";
for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
  let p = "";
  if (r === 0) p = piece(back[c], false, 52);
  if (r === 1) p = piece("pawn", false, 52);
  if (r === 6) p = piece("pawn", true, 52);
  if (r === 7) p = piece(back[c], true, 52);
  cells += `<div class="sq ${(r + c) % 2 ? "d" : "l"}">${p}</div>`;
}
document.body.insertAdjacentHTML("beforeend", `<h3>En tablero</h3><div class="board">${cells}</div>`);
</script>
</body></html>
