<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Free Life</title>
<style>
html,body{height:100%;margin:0;background:#1d3a6b;color:#fff;font:800 16px/1.4 system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
a{display:inline-block;margin-top:14px;padding:12px 20px;border-radius:12px;background:#33b249;color:#fff;text-decoration:none}
</style>
</head>
<body>
<div id="msg">Loading Free Life...</div>
<script>
const fail = () => {
  document.getElementById('msg').innerHTML = 'Your browser blocked the game in this frame.<br><a href="' + location.href + '" target="_blank" rel="noopener">Open the game in a new tab</a>';
};
const go = () => location.replace('game.html');
if (!('serviceWorker' in navigator)) fail();
else navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
  if (navigator.serviceWorker.controller) return go();
  navigator.serviceWorker.addEventListener('controllerchange', go);
  setTimeout(go, 3000);
}).catch(fail);
</script>
</body>
</html>
<script defer src="https://static.itch.io/htmlgame.js" type="text/javascript"></script>
